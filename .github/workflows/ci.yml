name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Restrict runtime networking to explicit user actions
        run: sh scripts/check-no-runtime-network.sh
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Build installable app
        run: sh scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/Scribe.app
      - name: Verify privacy entitlements
        run: |
          codesign -d --entitlements - dist/Scribe.app 2>&1 | grep -q com.apple.security.device.audio-input
          codesign -d --entitlements - dist/Scribe.app 2>&1 | grep -q com.apple.security.personal-information.calendars
      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/Scribe.app dist/Scribe.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Scribe-macOS
          path: dist/Scribe.zip
